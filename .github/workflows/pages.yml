# Publica a interface do SCR (scr-rust/ui) no GitHub Pages.
# No navegador, ui/web/api.js substitui os comandos do Tauri pelo núcleo em JavaScript.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site
        run: |
          mkdir -p _site
          cp -r scr-rust/ui/. _site/
          rm -f _site/test-ui.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
